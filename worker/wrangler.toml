name = "oss-scout-dashboard"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Only reachable at me.aadityad.dev, where Cloudflare Access sits in front.
workers_dev = false
preview_urls = false
routes = [{ pattern = "me.aadityad.dev", custom_domain = true }]

[triggers]
# 15:00 UTC = 8am Pacific (daylight time), 7am in winter. The daily email.
crons = ["0 15 * * *"]

[vars]
OWNER_LOGIN = "aadityad12"
OWNER_EMAIL = "aaditya.d.desai@gmail.com"
DATA_REPO = "aadityad12/oss-scout-data"
DATA_REF = "claude/scout-data"
DASHBOARD_URL = "https://me.aadityad.dev"
# From the Access app you create in worker/README.md step 1. Until both are filled
# in, every request is refused.
ACCESS_TEAM_DOMAIN = "aadityad.cloudflareaccess.com"
ACCESS_AUD = "43775c999d7a508bc4457d73716e19e2f644a1ef0c53749e0bc2a82c684156f6"
# MAIL_FROM = "OSS Scout <scout@aadityad.dev>"   # default; change if you use another sender

# Secrets (never put these here), set with `npx wrangler secret put <NAME>`:
