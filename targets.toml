# What the scout looks at, in priority order.
#
# The scout now aims at large, popular, company-backed open source projects
# (think Zephyr RTOS): ones with many users, paid reviewers and real names worth
# having on a resume. Each tier below has a `field` (an id from scout/fields.py)
# that tags the work for the career summary; [repo_fields] overrides it per repo.
#
# Tiers are a priority order, not a fence: open discovery (below) searches all
# of GitHub too, just with a lower weight, and only keeps big organization-owned
# repos. Edit freely; the scout re-reads this every run.

# Projects that assign every new issue to the maintainer of that area of the code.
# There an assignee is the reviewer, not someone already fixing it, so assigned
# issues stay in. (Zephyr assigns about 9 in 10.)
assignee_is_maintainer = ["zephyrproject-rtos/zephyr"]

[user]
login = "aadityad12"
name = "Aaditya Desai"   # the author name on commits made for you
# Languages you read comfortably. Anything else still shows up, ranked lower.
strong_languages = ["C++", "C", "Python"]
familiar_languages = ["Kotlin", "Java"]

[settings]
max_candidates = 10          # how many go to the Claude step each night
max_picks = 3                # Claude prepares at most this many a night (0 is fine)
max_ready = 1                # ...of which at most this many fully prepared for one-tap submit
max_unsent = 2               # no new ready item while this many prepared ones (new or failed) still wait to be sent
max_open_prs = 3             # no new ready PR while this many of your PRs are open
max_open_prs_per_repo = 1    # ...or while this many are open in that repo (briefings still fine)
max_per_repo_wide = 2        # candidates per repo while exploring widely
max_per_repo = 4             # ...and after home projects are chosen
repo_score_ttl_days = 7      # re-measure repo friendliness weekly
remeasure_per_run = 4        # ...a few stale repos per night, so runs stay short
measure_new_per_run = 8      # ...and at most this many never-measured repos (the rest wait a night)
issue_max_age_days = 365     # ignore issues older than this
claim_window_days = 21       # "I'll take this" comments newer than this = claimed
# max_checked = 120          # most issues whose timeline is read per run (default: max_candidates * 12; cached 3h)
stale_pr_days = 90           # a linked open PR untouched this long counts as abandoned and no longer blocks
skip_after_days = 14         # untouched suggestions become "skipped"
pass_cooldown_days = 60      # issues the Claude step turned down stay out this long
# "Let the data decide": go wide until this date, then recommend home projects.
# Pushed out to explore again with the large company-backed project list.
wide_phase_until = "2026-12-31"

[submit]
# Date the GitHub token used to submit approved work was created. Rotate the
# classic PAT every 90 days and update this; the digest warns after 80.
token_rotated = "2026-10-07"

[discovery]
enabled = true
weight = 0.6                 # discovered repos rank below every tier
languages = ["C", "C++", "Python"]
labels = ["good first issue", "help wanted", "bounty"]
min_stars = 3000             # large, popular projects only
require_org = true           # only repos owned by an organization (usually company-backed, paid reviewers)
updated_within_days = 60
max_issues_per_query = 30
max_repos = 20

# Label groups. A repo's labels are matched case-insensitively against these
# regexes, so "Good First Issue", "good-first-issue" and "E-easy" all count.
[labels]
beginner = ['good.?first', 'first.?timers?', 'beginner', '\beasy\b', 'starter', 'low.?hanging']
help = ['help.?wanted', 'contributions?.?welcome', 'up.?for.?grabs', 'pr.?welcome', 'community']
bounty = ['bounty', '💎', '\$\d+']
confirmed_bug = ['^reproduced$', '^confirmed', 'bug.?confirmed', 'verified']

[[tier]]
name = "Embedded & firmware"
field = "embedded"
weight = 1.0
repos = [
  "zephyrproject-rtos/zephyr",
  "espressif/esp-idf",
  "apache/nuttx",
  "project-chip/connectedhomeip",
  "openthread/openthread",
]

[[tier]]
name = "Systems & databases"
field = "databases"
weight = 1.0
repos = [
  "duckdb/duckdb",
  "ClickHouse/ClickHouse",
  "scylladb/scylladb",
  "meta/rocksdb",                # was facebook/rocksdb
  "apache/arrow",
  "tenstorrent/tt-metal",
]

[[tier]]
name = "AI / ML"
field = "ai-ml"
weight = 0.95
repos = [
  "ggml-org/llama.cpp",
  "vllm-project/vllm",
  "pytorch/pytorch",
  "huggingface/transformers",
  "huggingface/diffusers",
  "triton-lang/triton",
]

[[tier]]
name = "Cloud & infrastructure"
field = "cloud"
weight = 0.9
repos = [
  "envoyproxy/envoy",
  "grpc/grpc",
  "ray-project/ray",
  "open-telemetry/opentelemetry-cpp",
]

[[tier]]
name = "Security"
field = "security"
weight = 0.9
repos = [
  "Mbed-TLS/mbedtls",
  "wolfSSL/wolfssl",
  "openssl/openssl",
]

[[tier]]
name = "Python data & dev tools"
field = "data-eng"
weight = 0.75
repos = [
  "getsentry/sentry",
  "dagster-io/dagster",
  "PrefectHQ/prefect",
  "airbytehq/airbyte",
]

[[tier]]
name = "Kotlin / Android"
field = "mobile"
weight = 0.6
repos = [
  "JetBrains/compose-multiplatform",
]

# Per-repo field, when it differs from its tier's.
[repo_fields]
"tenstorrent/tt-metal" = "ai-ml"
"Mbed-TLS/mbedtls" = "security"
"getsentry/sentry" = "web"

# Per-repo extra labels worth watching (on top of the label groups above).
[repo_labels]
"duckdb/duckdb" = ["reproduced"]
# Zephyr has few beginner labels; its low-priority issues are the small, well-scoped ones.
"zephyrproject-rtos/zephyr" = ["priority: low"]
