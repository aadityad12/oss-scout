<style>
:root {
  --bg: #f3f4f8; --surface: #ffffff; --raised: #e8eaf2; --well: #f3f4f8;
  --line: #dfe2ec; --edge: #858aa0;
  --ink: #10121a; --text: #2a2d3a; --muted: #545869;
  --accent: #0000f2; --on-accent: #ffffff; --accent-text: #0000e0; --accent-soft: #e6e7ff;
  --alert: #be2a2f; --alert-soft: #fcebec; --alert-line: #f2c9cb;
  --shadow: 0 1px 2px rgba(16, 18, 26, .06), 0 8px 24px rgba(16, 18, 26, .08);
  --display: "Archivo", "Arial Narrow", sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0f14; --surface: #171922; --raised: #242736; --well: #0b0c10;
    --line: #2a2d3b; --edge: #666b84;
    --ink: #f4f5fa; --text: #d3d6e2; --muted: #9ea2b5;
    --accent: #5252ff; --on-accent: #ffffff; --accent-text: #9da0ff; --accent-soft: #1f2152;
    --alert: #ff6b70; --alert-soft: #2c1820; --alert-line: #4a2230;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0f14; --surface: #171922; --raised: #242736; --well: #0b0c10;
  --line: #2a2d3b; --edge: #666b84;
  --ink: #f4f5fa; --text: #d3d6e2; --muted: #9ea2b5;
  --accent: #5252ff; --on-accent: #ffffff; --accent-text: #9da0ff; --accent-soft: #1f2152;
  --alert: #ff6b70; --alert-soft: #2c1820; --alert-line: #4a2230;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: hidden; }
body { background: var(--bg); color: var(--text); font: 16px/1.55 var(--body); margin: 0; padding: 0 16px 56px; }
.wrap { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 44px; }
.wrap > *, section > * { min-width: 0; }
section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
a { color: var(--accent-text); text-underline-offset: 3px; transition: color .15s; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.muted { color: var(--muted); }
code { font: 500 .86em var(--mono); background: var(--raised); color: var(--ink); padding: 0 4px; border-radius: 4px; overflow-wrap: anywhere; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; }
.section-title h2 { font: 700 22px/1.2 var(--body); color: var(--ink); }
.section-title span { font-size: 14px; color: var(--muted); }

/* status dots: shape carries meaning, color stays neutral except blue/red */
.st { display: inline-flex; align-items: center; gap: 6px; font: 600 13px var(--body); color: var(--text); white-space: nowrap; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--muted); flex: none; }
.st.ok::before { background: var(--ink); box-shadow: none; }
.st.on::before { background: var(--accent); box-shadow: none; }
.st.attn { color: var(--alert); }
.st.attn::before { background: var(--alert); box-shadow: none; }

/* theme switch */
.theme { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--raised); }
.theme button { appearance: none; border: 0; background: none; color: var(--muted); width: 38px; height: 38px; display: grid; place-items: center; border-radius: 999px; cursor: pointer; }
.theme button svg { width: 18px; height: 18px; }
.theme button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); }
.theme button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.nav { display: flex; justify-content: space-between; align-items: center; gap: 4px 12px; padding: 12px 0 0; font-size: 15px; flex-wrap: wrap; }
.nav a { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; text-decoration: none; }
.nav a:hover { text-decoration: underline; }
.nav .right { display: flex; align-items: center; gap: 4px 14px; }
.hero { display: grid; gap: 14px; padding-top: 8px; }
.hero h1 { font: 600 clamp(40px, 9vw, 72px)/.95 var(--display); font-stretch: 62%; text-transform: uppercase; color: var(--ink); }
.hero p { margin: 0; max-width: 58ch; font-size: 18px; color: var(--text); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 4px; align-content: start; }
.stat b { font: 600 clamp(44px, 8vw, 64px)/1 var(--display); font-stretch: 62%; font-variant-numeric: tabular-nums; color: var(--ink); }
.stat span { font-size: 14px; color: var(--muted); }
.stats-note { margin: 0; font-size: 14px; color: var(--muted); }
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat.lead { grid-column: 1 / -1; }
}

/* projects */
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.project { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 10px; align-content: start; }
.project .repo { font: 500 14px/1.3 var(--mono); color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
.project .repo:hover { color: var(--accent-text); text-decoration: underline; }
.project .count { font: 600 32px/1.1 var(--display); font-stretch: 62%; color: var(--ink); font-variant-numeric: tabular-nums; }
.project .count small { font: 400 15px var(--body); font-stretch: 100%; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.facts { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }

/* featured */
.featured { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.feature { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; display: grid; gap: 12px; align-content: start; }
.feature .top { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.feature .repo { font: 400 13px/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.feature h3 { font: 700 19px/1.35 var(--body); color: var(--ink); overflow-wrap: anywhere; }
.feature .meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.feature .go { font-weight: 600; text-decoration: none; justify-self: start; display: inline-flex; align-items: center; min-height: 44px; }
.feature .go:hover { text-decoration: underline; }

/* pull requests */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.pr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 16px 20px; border-top: 1px solid var(--line); align-items: start; }
.list > :first-child { border-top: 0; }
.pr > * { min-width: 0; }
.pr .repo { font: 400 13px/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.pr h3 { font: 600 17px/1.4 var(--body); }
.pr h3, .feature h3 { text-wrap: pretty; }
.pr h3 a { color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
.pr h3 a:hover { color: var(--accent-text); text-decoration: underline; }
.pr .summary { margin: 0; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.pr .side { display: grid; justify-items: end; gap: 6px; text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
.more { display: block; width: 100%; min-height: 48px; border: 0; border-top: 1px solid var(--line); background: var(--raised); color: var(--ink); font: 700 16px var(--body); padding: 0 12px; cursor: pointer; }
.more:hover { color: var(--accent-text); }
.more:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 0; }
@media (max-width: 560px) {
  .pr { grid-template-columns: minmax(0, 1fr); }
  .pr .side { justify-items: start; grid-auto-flow: column; justify-content: start; align-items: center; gap: 10px; text-align: left; }
}

/* activity */
.activity { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 12px; }
.weeks { display: grid; grid-template-columns: repeat(26, minmax(0, 1fr)); gap: 4px; }
.weeks i { height: 24px; border-radius: 3px; background: var(--raised); display: block; }
.weeks i.l1 { background: color-mix(in srgb, var(--accent) 35%, var(--raised)); }
.weeks i.l2 { background: color-mix(in srgb, var(--accent) 65%, var(--raised)); }
.weeks i.l3 { background: color-mix(in srgb, var(--accent) 100%, var(--raised)); }
.scale { display: flex; justify-content: space-between; gap: 12px; font: 400 13px var(--mono); color: var(--muted); }
.activity p { margin: 0; font-size: 15px; color: var(--text); }
.activity p b { color: var(--ink); font-weight: 700; }

/* also active */
.also { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 680px) { .also { grid-template-columns: minmax(0, 1fr); } }
.also h3 { font: 700 17px var(--body); color: var(--ink); padding: 14px 20px 10px; }
.also h3 .muted { font-weight: 500; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; padding: 12px 20px; border-top: 1px solid var(--line); font-size: 15px; }
.item a { color: var(--ink); text-decoration: none; overflow-wrap: anywhere; font-weight: 600; }
.item a:hover { color: var(--accent-text); text-decoration: underline; }
.item .repo { grid-column: 1 / -1; font: 400 13px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.also .list > p { margin: 0; padding: 12px 20px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); }

/* empty */
.empty { background: var(--surface); border: 1.5px dashed var(--edge); border-radius: 12px; padding: 32px 28px; display: grid; gap: 10px; justify-items: start; }
.empty h2 { font: 700 26px/1.2 var(--body); color: var(--ink); }
.empty p { margin: 0; max-width: 56ch; color: var(--text); }
.empty .actions { display: flex; gap: 12px; flex-wrap: wrap; padding-top: 6px; }
.button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--edge); background: var(--raised); color: var(--ink); text-decoration: none; font: 700 16px var(--body); }
.button:hover { color: var(--accent-text); }
.button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.button.primary:hover { color: var(--on-accent); filter: brightness(1.12); }

.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 18px; }
.foot a { color: var(--muted); }
.foot a:hover { color: var(--accent-text); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

        <button type="button" data-theme-set="light" aria-label="Light" title="Light"><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2.1M10 16.1v2.1M1.8 10h2.1M16.1 10h2.1M4.2 4.2l1.5 1.5M14.3 14.3l1.5 1.5M4.2 15.8l1.5-1.5M14.3 5.7l1.5-1.5"/></svg></button>
        <button type="button" data-theme-set="dark" aria-label="Dark" title="Dark"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.6A7 7 0 0 1 7.4 3.5a7 7 0 1 0 9.1 9.1z" fill="currentColor"/></svg></button>

  <header class="hero">

  </footer>
</div>

<script>
function setTheme(t, save = true) {
  const root = document.documentElement;
  if (t === "light" || t === "dark") root.dataset.theme = t; else { delete root.dataset.theme; t = "auto"; }
  if (save) { try { t === "auto" ? localStorage.removeItem("oss-theme") : localStorage.setItem("oss-theme", t); } catch {} }
  document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeSet === t)));
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = getComputedStyle(document.body).backgroundColor;
}
setTheme(document.documentElement.dataset.theme || "auto", false);
document.addEventListener("click", e => { const b = e.target.closest("[data-theme-set]"); if (b) setTheme(b.dataset.themeSet); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => setTheme(document.documentElement.dataset.theme || "auto", false));

const DATA = /*__SCOUT_PUBLIC__*/null;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const code = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const safeUrl = u => /^https:\/\/github\.com\//.test(u || "") ? u : "#";
const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + "s"}`;
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" }) : "";
const fmtStars = n => n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k` : String(n);
const INITIAL_PRS = 10;

function prRow(p) {
  const merged = p.status === "merged";
  const when = merged ? `Merged ${fmtDate(p.merged_at)}` : `Opened ${fmtDate(p.created_at)}`;
  // "what I fixed": the PR's own summary when there is one, the title otherwise
  const headline = p.summary || p.title;
  const sub = p.summary ? `<p class="summary">${code(p.title)}</p>` : "";
  return `<article class="pr">
    <div>
      <div class="repo">${esc(p.repo)} #${esc(p.number)}</div>
      <h3><a href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">${code(headline)}</a></h3>
      ${sub}
    </div>
    <div class="side"><span class="st${merged ? " ok" : ""}">${merged ? "Merged" : "In review"}</span><span>${esc(when)}</span></div>
  </article>`;
}

function featureCard(p, info) {
  const bits = [`Merged ${esc(fmtDate(p.merged_at))}`,
                info.language && esc(info.language),
                info.stars != null && `&#9733; ${esc(fmtStars(info.stars))}`].filter(Boolean).join(" &middot; ");
  return `<article class="feature">
    <div class="top"><span class="repo">${esc(p.repo)} #${esc(p.number)}</span><span class="st ok">Merged</span></div>
    <h3>${code(p.summary || p.title)}</h3>
    <div class="meta">${bits}</div>
    <a class="go" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">View pull request on GitHub &rarr;</a>
  </article>`;
}

function projectCard(p, max) {
  const chips = [p.language && esc(p.language),
                 p.stars != null && `&#9733; ${esc(fmtStars(p.stars))}`,
                 p.merged && p.open ? `${esc(p.open)} in review` : ""].filter(Boolean).join(" &middot; ");
  const count = p.merged
    ? `${p.merged} <small>merged</small>`
    : `${p.open} <small>in review</small>`;
  return `<div class="project">
    <a class="repo" href="https://github.com/${esc(p.repo)}" target="_blank" rel="noopener">${esc(p.repo)}</a>
    <div class="count">${count}</div>
    <div class="meter" aria-hidden="true"><i style="width:${Math.max(8, Math.round(100 * p.merged / max))}%"></i></div>
    ${chips ? `<div class="facts">${chips}</div>` : ""}
  </div>`;
}

function renderActivity(a) {
  const weeks = a.weeks || [];
  const cells = weeks.map(w => `<i class="${w.n ? "l" + Math.min(w.n, 3) : ""}" title="${esc(`Week of ${fmtDate(w.week)}: ${plural(w.n, "contribution")}`)}"></i>`).join("");
  const last26 = weeks.filter(w => w.n).length;
  const bits = [`Active in <b>${last26}</b> of the last ${weeks.length} weeks`];
  if (a.streak > 1) bits.push(`a <b>${a.streak}-week</b> streak`);
  return `<div class="activity">
    <div class="weeks" role="img" aria-label="${esc(bits.join(", ").replace(/<\/?b>/g, ""))}">${cells}</div>
    <div class="scale"><span>${esc(weeks.length)} weeks ago</span><span>this week</span></div>
    <p>${bits.join(", ")}.</p>
  </div>`;
}

function alsoList(title, items, line) {
  if (!items.length) return "";
  const shown = items.slice(0, 5).map(i => `<div class="item"><span class="repo">${esc(i.repo)} #${esc(i.number)}</span><a href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener">${code(i.title)}</a>${line(i)}</div>`).join("");
  const rest = items.length > 5 ? `<p>and ${items.length - 5} more</p>` : "";
  return `<div class="list"><h3>${esc(title)} <span class="muted">${items.length}</span></h3>${shown}${rest}</div>`;
}

function renderEmpty() {
  return `<div class="empty">
    <span class="eyebrow">Status</span>
    <h2>First contributions in progress</h2>
    <p>Merged pull requests, the projects they landed in, and reviews I've given will show up here as they happen. Check back soon.</p>
    <div class="actions"><a class="button primary" href="https://github.com/${esc(DATA.login)}" target="_blank" rel="noopener">See my GitHub</a><a class="button" href="https://aadityad.dev">Back to my portfolio</a></div>
  </div>`;
}

function boot() {
  const main = $("#main");
  if (!DATA) { main.innerHTML = `<div class="empty"><h2>First contributions in progress</h2><p>Check back soon.</p></div>`; return; }
  const gh = `https://github.com/${DATA.login}`;
  $("#gh-link").href = gh;
  $("#gh-foot").href = gh;
  $("#updated").textContent = `Updated ${fmtDate(DATA.generated_at)}`;

  const prs = DATA.prs || [], featured = DATA.featured || [];
  if (!prs.length && !featured.length) { main.innerHTML = renderEmpty(); return; }

  const reviews = DATA.reviews || [], issues = DATA.issues || [];
  const projects = DATA.projects || [];
  const merged = projects.filter(p => p.merged).length;
  const secondary = [reviews.length && plural(reviews.length, "review") + " given",
                     issues.length && plural(issues.length, "issue") + " filed"].filter(Boolean).join(" &middot; ");

  const order = { open: 0, merged: 1 };
  const sorted = [...prs].filter(p => p.status in order).sort((a, b) =>
    order[a.status] - order[b.status] ||
    (b.merged_at || b.created_at || "").localeCompare(a.merged_at || a.created_at || ""));

  let html = `<section aria-label="Summary"><div class="stats">
    <div class="stat lead"><b>${esc(DATA.merged_prs)}</b><span>merged pull requests</span></div>
    <div class="stat"><b>${esc(merged)}</b><span>${merged === 1 ? "project" : "projects"} contributed to</span></div>
    <div class="stat"><b>${esc(DATA.open_prs)}</b><span>open, in review</span></div>
  </div>${secondary ? `<p class="stats-note">Also: ${secondary}</p>` : ""}</section>`;

  if (featured.length) {
    const byRepo = Object.fromEntries((DATA.projects || []).map(p => [p.repo, p]));
    html += `<section aria-labelledby="t-featured"><div class="section-title"><h2 id="t-featured">Featured</h2><span>a few that show what I do</span></div>
      <div class="featured">${featured.map(p => featureCard(p, byRepo[p.repo] || {})).join("")}</div></section>`;
  }

  html += `<section aria-labelledby="t-projects"><div class="section-title"><h2 id="t-projects">Projects</h2><span>ordered by merged pull requests</span></div>
    <div class="projects">${projects.map(p => projectCard(p, Math.max(1, ...projects.map(x => x.merged)))).join("")}</div></section>`;

  // featured PRs are shown above and left out of this list, so nothing appears twice
  if (sorted.length) {
    html += `<section aria-labelledby="t-prs"><div class="section-title"><h2 id="t-prs">${featured.length ? "More pull requests" : "Pull requests"}</h2><span>${plural(sorted.length, "pull request")}</span></div>
    <div class="list" id="prs">${sorted.slice(0, INITIAL_PRS).map(prRow).join("")}${sorted.length > INITIAL_PRS ? `<button class="more" id="more" type="button">Show all ${sorted.length}</button>` : ""}</div></section>`;
  }

  const act = DATA.activity;
  if (act && (act.weeks || []).some(w => w.n)) {
    html += `<section aria-labelledby="t-activity"><div class="section-title"><h2 id="t-activity">Activity</h2><span>${plural(act.weeks_active, "active week")} in total</span></div>${renderActivity(act)}</section>`;
  }

  if (reviews.length || issues.length) {
    html += `<section aria-labelledby="t-also"><div class="section-title"><h2 id="t-also">Also active in</h2></div><div class="also">
      ${alsoList("Reviews given", reviews, () => "")}
      ${alsoList("Issues filed", issues, i => `<span class="st${i.state === "closed" ? " ok" : ""}">${i.state === "closed" ? "Closed" : "Open"}</span>`)}
    </div></section>`;
  }

  main.innerHTML = html;
  const more = $("#more");
  if (more) more.addEventListener("click", () => {
    $("#prs").innerHTML = sorted.map(prRow).join("");
  });
}
boot();
</script>
</body>
</html>
