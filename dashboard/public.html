<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #faf5ec;
  --surface: #fffdf8;
  --sunken: #f0e9da;
  --ink: #221f1a;
  --muted: #6f6a5f;
  --line: #e3dbcc;
  --accent: #e4572e;
  --accent-soft: #fbe3d9;
  --merged: #6f4fc4;
  --merged-soft: #ece6f9;
  --open: #3e7c4f;
  --open-soft: #e0efe3;
  --shadow: 0 1px 2px rgba(34, 31, 26, .05), 0 6px 20px rgba(34, 31, 26, .05);
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Instrument Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #181612; --surface: #201d18; --sunken: #2a261f; --ink: #efe8da; --muted: #a69f90;
    --line: #353027; --accent: #f0724c; --accent-soft: #3d241a; --merged: #a78bfa; --merged-soft: #2a2343;
    --open: #6cc17f; --open-soft: #1d3324; --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #181612; --surface: #201d18; --sunken: #2a261f; --ink: #efe8da; --muted: #a69f90;
  --line: #353027; --accent: #f0724c; --accent-soft: #3d241a; --merged: #a78bfa; --merged-soft: #2a2343;
  --open: #6cc17f; --open-soft: #1d3324; --shadow: 0 1px 2px rgba(0, 0, 0, .4);
}

* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: hidden; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); margin: 0; padding: 0 16px 56px; }
.wrap { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 44px; }
.wrap > *, section > * { min-width: 0; }
section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.muted { color: var(--muted); }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-title h2 { font-size: 24px; font-weight: 600; }
.section-title span { font-size: 14px; color: var(--muted); }

/* header */
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 0 0; font-size: 14px; flex-wrap: wrap; }
.nav a { color: var(--ink); text-decoration: none; font-weight: 500; }
.nav a:hover { color: var(--accent); }
.nav .right { display: flex; gap: 18px; }
.hero { display: grid; gap: 14px; padding-top: 8px; }
.hero h1 { font-size: clamp(34px, 7vw, 56px); line-height: 1.05; font-weight: 700; }
.hero p { margin: 0; max-width: 58ch; font-size: 18px; color: var(--muted); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 4px; box-shadow: var(--shadow); }
.stat b { font: 700 clamp(34px, 6vw, 48px)/1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 14px; color: var(--muted); }
.stat.lead b { color: var(--merged); }
.stats-note { margin: 0; font-size: 14px; color: var(--muted); }
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat.lead { grid-column: 1 / -1; }
}

/* badges + chips */
.badge { font: 500 11px/1 var(--mono); padding: 5px 8px; border-radius: 999px; white-space: nowrap; }
.b-merged { background: var(--merged-soft); color: var(--merged); }
.b-open { background: var(--open-soft); color: var(--open); }
.chip { font-size: 12px; line-height: 1; padding: 5px 9px; border-radius: 999px; background: var(--sunken); color: var(--muted); white-space: nowrap; }

/* projects */
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.project { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 10px; align-content: start; }
.project .repo { font: 500 13px/1.3 var(--mono); color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
.project .repo:hover { color: var(--accent); }
.project .count { font: 600 26px/1.1 var(--display); }
.project .count small { font: 400 15px var(--body); color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* pull requests */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.pr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 16px 20px; border-top: 1px solid var(--line); align-items: start; }
.list > :first-child { border-top: 0; }
.pr .repo { font: 400 12px/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.pr h3 { font: 600 17px/1.35 var(--body); letter-spacing: 0; }
.pr h3 a { color: var(--ink); text-decoration: none; }
.pr h3 a:hover { color: var(--accent); text-decoration: underline; }
.pr .summary { margin: 0; font-size: 14.5px; color: var(--muted); }
.pr .side { display: grid; justify-items: end; gap: 6px; text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
.more { width: 100%; border: 0; border-top: 1px solid var(--line); background: var(--sunken); color: var(--ink); font: 500 14px var(--body); padding: 12px; cursor: pointer; }
.more:hover { color: var(--accent); }
.more:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
@media (max-width: 560px) {
  .pr { grid-template-columns: minmax(0, 1fr); }
  .pr .side { justify-items: start; grid-auto-flow: column; justify-content: start; align-items: center; gap: 10px; text-align: left; }
}

/* activity */
.activity { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 12px; }
.weeks { display: grid; grid-template-columns: repeat(26, minmax(0, 1fr)); gap: 4px; }
.weeks i { aspect-ratio: 1; border-radius: 3px; background: var(--sunken); display: block; }
.weeks i.l1 { background: color-mix(in srgb, var(--accent) 38%, var(--sunken)); }
.weeks i.l2 { background: color-mix(in srgb, var(--accent) 68%, var(--sunken)); }
.weeks i.l3 { background: var(--accent); }
.scale { display: flex; justify-content: space-between; font: 400 11px var(--mono); color: var(--muted); }
.activity p { margin: 0; font-size: 14.5px; color: var(--muted); }
.activity p b { color: var(--ink); font-weight: 600; }

/* also active */
.also { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 680px) { .also { grid-template-columns: minmax(0, 1fr); } }
.also h3 { font: 600 15px var(--body); padding: 14px 20px 10px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 20px; border-top: 1px solid var(--line); font-size: 14px; }
.item a { color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
.item a:hover { color: var(--accent); text-decoration: underline; }
.item .repo { grid-column: 1 / -1; font: 400 11.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.also .list > p { margin: 0; padding: 10px 20px 14px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }

/* empty */
.empty { background: var(--surface); border: 1.5px dashed var(--line); border-radius: 16px; padding: 32px 28px; display: grid; gap: 10px; justify-items: start; }
.empty h2 { font-size: 26px; font-weight: 600; }
.empty p { margin: 0; max-width: 56ch; color: var(--muted); }
.empty .actions { display: flex; gap: 12px; flex-wrap: wrap; padding-top: 6px; }
.button { display: inline-block; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-weight: 500; font-size: 14px; background: var(--bg); }
.button:hover { border-color: var(--accent); color: var(--accent); }
.button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.button.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 18px; }
.foot a { color: var(--muted); }
.foot a:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav" aria-label="Site">
    <a href="https://aadityad.dev">&larr; aadityad.dev</a>
    <div class="right"><a id="gh-link" href="https://github.com/aadityad12" rel="noopener">GitHub</a></div>
  </nav>

  <header class="hero">
    <span class="eyebrow">Open source</span>
    <h1>Contributions to projects I don't own.</h1>
    <p>Pull requests, reviews and issues in other people's open source projects. Every item links to the real thing on GitHub.</p>
  </header>

  <main id="main" class="wrap"></main>

  <footer class="foot">
    <span id="updated"></span>
    <span><a href="https://aadityad.dev">aadityad.dev</a> &middot; <a id="gh-foot" href="https://github.com/aadityad12" rel="noopener">GitHub</a></span>
  </footer>
</div>

<script>
const DATA = /*__SCOUT_PUBLIC__*/null;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https:\/\/github\.com\//.test(u || "") ? u : "#";
const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + "s"}`;
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" }) : "";
const fmtStars = n => n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k` : String(n);
const INITIAL_PRS = 10;

function prRow(p) {
  const merged = p.status === "merged";
  const when = merged ? `Merged ${fmtDate(p.merged_at)}` : `Opened ${fmtDate(p.created_at)}`;
  // "what I fixed": the PR's own summary when there is one, the title otherwise
  const headline = p.summary || p.title;
  const sub = p.summary ? `<p class="summary">${esc(p.title)}</p>` : "";
  return `<article class="pr">
    <div>
      <div class="repo">${esc(p.repo)} #${esc(p.number)}</div>
      <h3><a href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">${esc(headline)}</a></h3>
      ${sub}
    </div>
    <div class="side"><span class="badge ${merged ? "b-merged" : "b-open"}">${merged ? "Merged" : "In review"}</span><span>${esc(when)}</span></div>
  </article>`;
}

function projectCard(p, max) {
  const chips = [p.language && `<span class="chip">${esc(p.language)}</span>`,
                 p.stars != null && `<span class="chip">&#9733; ${esc(fmtStars(p.stars))}</span>`,
                 p.merged && p.open ? `<span class="chip">${esc(p.open)} in review</span>` : ""].filter(Boolean).join("");
  const count = p.merged
    ? `${p.merged} <small>merged</small>`
    : `${p.open} <small>in review</small>`;
  return `<div class="project">
    <a class="repo" href="https://github.com/${esc(p.repo)}" target="_blank" rel="noopener">${esc(p.repo)}</a>
    <div class="count">${count}</div>
    <div class="meter" aria-hidden="true"><i style="width:${Math.max(8, Math.round(100 * p.merged / max))}%"></i></div>
    ${chips ? `<div class="chips">${chips}</div>` : ""}
  </div>`;
}

function renderActivity(a) {
  const weeks = a.weeks || [];
  const cells = weeks.map(w => `<i class="${w.n ? "l" + Math.min(w.n, 3) : ""}" title="${esc(`Week of ${fmtDate(w.week)}: ${plural(w.n, "contribution")}`)}"></i>`).join("");
  const last26 = weeks.filter(w => w.n).length;
  const bits = [`Active in <b>${last26}</b> of the last ${weeks.length} weeks`];
  if (a.streak > 1) bits.push(`a <b>${a.streak}-week</b> streak`);
  return `<div class="activity">
    <div class="weeks" role="img" aria-label="${esc(bits.join(", ").replace(/<\/?b>/g, ""))}">${cells}</div>
    <div class="scale"><span>${esc(weeks.length)} weeks ago</span><span>this week</span></div>
    <p>${bits.join(", ")}.</p>
  </div>`;
}

function alsoList(title, items, line) {
  if (!items.length) return "";
  const shown = items.slice(0, 5).map(i => `<div class="item"><span class="repo">${esc(i.repo)} #${esc(i.number)}</span><a href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener">${esc(i.title)}</a>${line(i)}</div>`).join("");
  const rest = items.length > 5 ? `<p>and ${items.length - 5} more</p>` : "";
  return `<div class="list"><h3>${esc(title)} <span class="muted">${items.length}</span></h3>${shown}${rest}</div>`;
}

function renderEmpty() {
  return `<div class="empty">
    <span class="eyebrow">Status</span>
    <h2>First contributions in progress</h2>
    <p>Merged pull requests, the projects they landed in, and reviews I've given will show up here as they happen. Nothing to show yet, and nothing padded in the meantime.</p>
    <div class="actions"><a class="button primary" href="https://github.com/${esc(DATA.login)}" target="_blank" rel="noopener">See my GitHub</a><a class="button" href="https://aadityad.dev">Back to my portfolio</a></div>
  </div>`;
}

function boot() {
  const main = $("#main");
  if (!DATA) { main.innerHTML = `<div class="empty"><h2>First contributions in progress</h2><p>Check back soon.</p></div>`; return; }
  const gh = `https://github.com/${DATA.login}`;
  $("#gh-link").href = gh;
  $("#gh-foot").href = gh;
  $("#updated").textContent = `Updated ${fmtDate(DATA.generated_at)}`;

  const prs = DATA.prs || [];
  if (!prs.length) { main.innerHTML = renderEmpty(); return; }

  const reviews = DATA.reviews || [], issues = DATA.issues || [];
  const projects = DATA.projects || [];
  const merged = projects.filter(p => p.merged).length;
  const secondary = [reviews.length && plural(reviews.length, "review") + " given",
                     issues.length && plural(issues.length, "issue") + " filed"].filter(Boolean).join(" &middot; ");

  const order = { open: 0, merged: 1 };
  const sorted = [...prs].filter(p => p.status in order).sort((a, b) =>
    order[a.status] - order[b.status] ||
    (b.merged_at || b.created_at || "").localeCompare(a.merged_at || a.created_at || ""));

  let html = `<section aria-label="Summary"><div class="stats">
    <div class="stat lead"><b>${esc(DATA.merged_prs)}</b><span>merged pull requests</span></div>
    <div class="stat"><b>${esc(merged)}</b><span>${merged === 1 ? "project" : "projects"} contributed to</span></div>
    <div class="stat"><b>${esc(DATA.open_prs)}</b><span>open, in review</span></div>
  </div>${secondary ? `<p class="stats-note">Also: ${secondary}</p>` : ""}</section>`;

  html += `<section aria-labelledby="t-projects"><div class="section-title"><h2 id="t-projects">Projects</h2><span>ordered by merged pull requests</span></div>
    <div class="projects">${projects.map(p => projectCard(p, Math.max(1, ...projects.map(x => x.merged)))).join("")}</div></section>`;

  html += `<section aria-labelledby="t-prs"><div class="section-title"><h2 id="t-prs">Pull requests</h2><span>${plural(sorted.length, "pull request")}</span></div>
    <div class="list" id="prs">${sorted.slice(0, INITIAL_PRS).map(prRow).join("")}${sorted.length > INITIAL_PRS ? `<button class="more" id="more" type="button">Show all ${sorted.length}</button>` : ""}</div></section>`;

  const act = DATA.activity;
  if (act && (act.weeks || []).some(w => w.n)) {
    html += `<section aria-labelledby="t-activity"><div class="section-title"><h2 id="t-activity">Activity</h2><span>${plural(act.weeks_active, "active week")} in total</span></div>${renderActivity(act)}</section>`;
  }

  if (reviews.length || issues.length) {
    html += `<section aria-labelledby="t-also"><div class="section-title"><h2 id="t-also">Also active in</h2></div><div class="also">
      ${alsoList("Reviews given", reviews, () => "")}
      ${alsoList("Issues filed", issues, i => `<span class="chip">${esc(i.state === "closed" ? "closed" : "open")}</span>`)}
    </div></section>`;
  }

  main.innerHTML = html;
  const more = $("#more");
  if (more) more.addEventListener("click", () => {
    $("#prs").innerHTML = sorted.map(prRow).join("");
  });
}
boot();
</script>
</body>
</html>
