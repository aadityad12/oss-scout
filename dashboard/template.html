<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>OSS Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<style>
:root {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --sunken: #eaefed;
  --ink: #16201d;
  --muted: #5b6964;
  --line: #d9e1de;
  --accent: #1e6b5a;
  --accent-soft: #d8ebe5;
  --open: #1a7f37;
  --merged: #8250df;
  --closed: #cf222e;
  --late-soft: #fdeaec;
  --wait: #b35900;
  --wait-soft: #fff1e0;
  --neutral: #6e7781;
  --star: #b8860b;
  --add-bg: #e6f4ea;
  --add-ink: #13602b;
  --del-bg: #fbe9eb;
  --del-ink: #a0111f;
  --shadow: 0 1px 2px rgba(22, 32, 29, .06), 0 4px 16px rgba(22, 32, 29, .05);
  --bar-shadow: 0 -2px 6px rgba(22, 32, 29, .08), 0 6px 20px rgba(22, 32, 29, .16);
  --display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1412; --surface: #151d1a; --sunken: #1b2522; --ink: #e3ebe7; --muted: #93a39d;
    --line: #27322e; --accent: #5fc3a8; --accent-soft: #1d3a32; --open: #3fb950; --merged: #a371f7;
    --closed: #f85149; --late-soft: #3a1417; --wait: #f0a04b; --wait-soft: #3a2a14; --neutral: #8b949e; --star: #e3b341;
    --add-bg: #12301d; --add-ink: #7ee2a0; --del-bg: #3a1417; --del-ink: #ff9aa2;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    --bar-shadow: 0 -2px 6px rgba(0, 0, 0, .35), 0 6px 20px rgba(0, 0, 0, .55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1412; --surface: #151d1a; --sunken: #1b2522; --ink: #e3ebe7; --muted: #93a39d;
  --line: #27322e; --accent: #5fc3a8; --accent-soft: #1d3a32; --open: #3fb950; --merged: #a371f7;
  --closed: #f85149; --late-soft: #3a1417; --wait: #f0a04b; --wait-soft: #3a2a14; --neutral: #8b949e; --star: #e3b341;
  --add-bg: #12301d; --add-ink: #7ee2a0; --del-bg: #3a1417; --del-ink: #ff9aa2;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  --bar-shadow: 0 -2px 6px rgba(0, 0, 0, .35), 0 6px 20px rgba(0, 0, 0, .55);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body);
  padding-inline: 16px; padding-block: 18px calc(40px + env(safe-area-inset-bottom));
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.wrap > * { min-width: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
code, .mono { font-family: var(--mono); font-size: .88em; }
.muted { color: var(--muted); }
.bad { color: var(--closed); font-weight: 700; }
.ok { color: var(--open); }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.top h1 { font-size: 26px; font-weight: 800; }
.todo { font: 600 13px/1 var(--body); padding: 6px 10px; border-radius: 999px; background: var(--accent); color: #fff; white-space: nowrap; }
.todo.zero { background: var(--sunken); color: var(--muted); }
.top .sub { flex-basis: 100%; font-size: 13px; color: var(--muted); }
.banner { background: var(--wait-soft); border: 1px solid var(--wait); border-radius: 10px; padding: 12px 14px; font-size: 14px; }
.banner b { color: var(--wait); }

/* tabs */
nav.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button {
  appearance: none; flex: 1 0 auto; min-height: 44px; border: 0; background: none; color: var(--muted); font: 500 14px var(--body);
  padding: 0 6px; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; white-space: nowrap;
}
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs .n { font: 500 11px var(--mono); margin-left: 3px; padding: 2px 5px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
nav.tabs .n.hot { background: var(--accent); color: #fff; }
section.panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
section.panel > * { min-width: 0; }

.group { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.group-title { display: flex; align-items: baseline; gap: 8px; margin: 6px 2px 0; font: 600 13px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.group-title .n { font-family: var(--mono); letter-spacing: 0; }
.group-title.hot { color: var(--wait); }
.group-hint { margin: -4px 2px 0; font-size: 13px; color: var(--muted); }
details.snoozed > summary { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0; cursor: pointer; list-style: none; }
details.snoozed > summary::-webkit-details-marker { display: none; }
details.snoozed > summary::after { content: "+"; font: 500 16px var(--mono); }
details.snoozed[open] > summary::after { content: "\2212"; }
details.snoozed .rows { display: grid; gap: 8px; margin-top: 6px; }

/* chips */
.chip { display: inline-block; font: 500 12px/1 var(--body); padding: 5px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.guide { background: var(--wait-soft); color: var(--wait); font-weight: 600; }
.chip.late { background: var(--closed); color: #fff; font-weight: 600; }
.chip.wait { background: var(--wait); color: #fff; font-weight: 600; }
.chip.good { background: var(--open); color: #fff; font-weight: 600; }
.chip.merged { background: var(--merged); color: #fff; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* rows */
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; scroll-margin-top: 10px; }
.item.open { border-color: var(--accent); box-shadow: var(--shadow); }
.item.late { border-color: var(--closed); background: var(--late-soft); }
.item.late.open { background: var(--surface); }
.head { appearance: none; width: 100%; min-height: 60px; display: grid; gap: 4px; padding: 11px 14px; text-align: left; background: none; border: 0; border-radius: 12px; color: inherit; font: inherit; cursor: pointer; }
.head .top-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
.head .ref { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12.5px var(--mono); color: var(--muted); }
.head .sp { flex: 1; }
.head .age { flex: none; font-size: 12px; color: var(--muted); white-space: nowrap; }
.head .title-line { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.head .t { font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item.open .head .t { -webkit-line-clamp: unset; }
.chev { flex: none; margin-top: 1px; color: var(--muted); font: 500 12px var(--mono); transition: transform .15s; }
.item.open .chev { transform: rotate(180deg); }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }

/* detail */
.detail { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 14px 14px 14px; border-top: 1px solid var(--line); }
.detail > *, .sec > * { min-width: 0; }
.detail[hidden] { display: none; }
.sec { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.sec h4 { font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.read30 { display: grid; gap: 8px; background: var(--sunken); border-radius: 10px; padding: 12px; }
.read30 .l { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 8px; font-size: 14.5px; line-height: 1.45; }
.read30 .lab { font: 600 11px/1.9 var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.read30 .v { overflow-wrap: anywhere; }
.err { color: var(--closed); font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.note { font-size: 13px; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
.reason { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--wait-soft); font-size: 14px; }
.disclosure { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--wait-soft); font-size: 14px; overflow-wrap: anywhere; }
.disclosure mark { background: var(--wait); color: #fff; padding: 1px 4px; border-radius: 4px; font-weight: 600; }

.md { max-width: 70ch; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md p, .md ul, .md ol { margin: 0 0 8px; }
.md > :last-child { margin-bottom: 0; }
.md pre { background: var(--sunken); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
.md code { background: var(--sunken); padding: 1px 4px; border-radius: 4px; }
.md pre code { background: none; padding: 0; }
.md img { max-width: 100%; }
.cmt { border-left: 3px solid var(--wait); padding: 2px 0 2px 12px; display: grid; gap: 4px; }
.cmt .who { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.facts { display: grid; gap: 6px; font-size: 14px; }
.facts ul { margin: 0; padding-left: 18px; }
.qa { display: grid; gap: 10px; }
.qa > div { border-left: 2px solid var(--line); padding-left: 12px; }
.qa b { display: block; }

.diff { font: 12.5px/1.5 var(--mono); background: var(--sunken); border-radius: 8px; overflow-x: auto; max-height: 420px; overflow-y: auto; }
.diff pre { margin: 0; padding: 8px 0; min-width: max-content; }
.diff span { display: block; padding: 0 12px; white-space: pre; }
.diff .add { background: var(--add-bg); color: var(--add-ink); }
.diff .del { background: var(--del-bg); color: var(--del-ink); }
.diff .hunk { color: var(--accent); }
.diff .meta { color: var(--muted); font-weight: 500; }

.copyable { position: relative; background: var(--sunken); border-radius: 8px; padding: 12px 14px; padding-right: 84px; white-space: pre-wrap; overflow-wrap: anywhere; font: 13.5px var(--mono); min-height: 54px; }
.copy { position: absolute; top: 4px; right: 4px; appearance: none; min-height: 44px; min-width: 64px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 13px var(--body); padding: 0 12px; border-radius: 8px; cursor: pointer; }

.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
.field input, .field textarea { width: 100%; font: 16px/1.45 var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.field input { min-height: 44px; }
.field textarea { min-height: 200px; font-family: var(--mono); font-size: 14px; resize: vertical; }
.field textarea.short { min-height: 140px; }

details.fold { border-top: 1px solid var(--line); }
details.fold:last-of-type { border-bottom: 1px solid var(--line); }
details.fold > summary { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; list-style: none; font-weight: 600; font-size: 14.5px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; font: 500 16px var(--mono); color: var(--muted); }
details.fold[open] > summary::after { content: "\2212"; }
details.fold > .inner { padding: 0 0 14px; display: grid; gap: 10px; }
.folds { display: grid; }
.foot-note { margin: 0; font-size: 12.5px; color: var(--muted); }
.linkbtn { appearance: none; border: 0; background: none; color: var(--accent); font: 600 14px var(--body); min-height: 44px; padding: 0 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* the action bar: pinned to the bottom of the screen while the item's content is on screen */
.bar { position: sticky; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 5; display: grid; gap: 8px; margin-top: 4px; padding: 10px; background: var(--surface); border: 1px solid var(--accent); border-radius: 14px; box-shadow: var(--bar-shadow); }
.bar .result { font-size: 14px; padding: 0 2px; overflow-wrap: anywhere; }
.bar .result:empty { display: none; }
.bar-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { appearance: none; flex: 1 1 64px; min-height: 48px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; text-align: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 15px var(--body); cursor: pointer; text-decoration: none; }
.btn.primary { flex: 2 1 120px; background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.wide, .btn.primary.wide { flex: 1 1 120px; }
.btn.danger { color: var(--closed); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.sm { min-height: 44px; flex: none; font-size: 14px; }
.result { font-size: 14px; }
.result.ok { color: var(--open); }
.result.bad { color: var(--closed); }
.result .btn { display: flex; width: 100%; min-height: 44px; margin: 8px 0 2px; padding: 0 14px; }

/* portfolio */
.pf-note { display: grid; gap: 4px; background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.pf-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.stat b { font: 700 24px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.pf { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: start; }
.pf.feat { border-left: 4px solid var(--star); }
.pf .main { min-width: 0; display: grid; gap: 3px; }
.pf .ref { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.pf .head-t { font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.pf .head-t a { color: var(--ink); text-decoration: none; }
.pf .sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.pf .no-line { font-size: 13px; color: var(--muted); font-style: italic; }
.pf .tools { display: flex; gap: 6px; }
.pf .full { grid-column: 1 / -1; display: grid; gap: 8px; }
.icon-btn { appearance: none; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }
.icon-btn[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.icon-btn:disabled { opacity: .4; cursor: default; }
.edit-row { display: flex; gap: 8px; flex-wrap: wrap; }
.edit-row .btn { flex: 1 1 90px; min-height: 44px; }
.count { font-size: 12px; color: var(--muted); text-align: right; }
.cards { display: grid; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.card .repo { font: 500 13px var(--mono); overflow-wrap: anywhere; }
.card .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }

/* projects */
.home { background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.home h3 { font-size: 17px; color: var(--accent); }
.home p { margin: 0; }
.home ol { margin: 0; padding-left: 20px; }
.bar-meter { display: inline-block; width: 64px; height: 6px; background: var(--sunken); border-radius: 3px; vertical-align: middle; margin-right: 8px; overflow: hidden; }
.bar-meter i { display: block; height: 100%; background: var(--accent); }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 12px; font-size: 13.5px; margin: 0; }
.kv div { display: grid; }
.kv dt { color: var(--muted); font-size: 12px; }
.kv dd { margin: 0; }
.policy-restrictive { color: var(--closed); font-weight: 600; }
.policy-disclosure { color: var(--wait); font-weight: 600; }

/* log */
.logrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 11px 14px; border-top: 1px solid var(--line); align-items: start; }
.logrow:first-child { border-top: 0; }
.logrow .k { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.logrow .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
.logrow .what { grid-column: 1 / -1; font-size: 14px; overflow-wrap: anywhere; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.res-ok { color: var(--open); font-weight: 600; }
.res-bad { color: var(--closed); font-weight: 600; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 6px; }
.empty h3 { font-size: 17px; }
.empty p { margin: 0; }
.foot { font-size: 12px; color: var(--muted); margin: 0; }
</style>

<body>
<div class="wrap">
  <header class="top">
    <h1>OSS Scout</h1>
    <span class="todo" id="todo"></span>
    <div class="sub" id="sub"></div>
  </header>
  <div id="banner"></div>
  <nav class="tabs" role="tablist" id="tabs" aria-label="Sections"></nav>
  <main id="main"></main>
  <p class="foot">Status comes straight from GitHub each night. Nothing is posted anywhere until you tap a button on this page.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const DATA = /*__SCOUT_DATA__*/null;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https:\/\/github\.com\//.test(u || "") ? u : "#";
const code = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const link = (url, text) => `<a href="${esc(safeUrl(url))}" target="_blank" rel="noopener">${text}</a>`;
if (window.DOMPurify) DOMPurify.addHook("afterSanitizeAttributes", n => { if (n.tagName === "A") { n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } });
const md = s => {
  if (!s) return "";
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(String(s)), { FORBID_TAGS: ["img", "style"] });
  return `<p>${esc(s).replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>")}</p>`;
};
const ago = iso => {
  if (!iso) return "";
  const d = (Date.now() - new Date(iso)) / 86400000;
  if (d < 1 / 24) return "just now";
  if (d < 1) return `${Math.round(d * 24)}h ago`;
  if (d < 60) return `${Math.round(d)}d ago`;
  return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
};
const short = iso => {
  if (!iso) return "";
  const h = (Date.now() - new Date(iso)) / 36e5;
  if (h < 1) return "now";
  if (h < 48) return `${Math.round(h)}h`;
  if (h < 24 * 60) return `${Math.round(h / 24)}d`;
  return `${Math.round(h / 24 / 30)}mo`;
};
const hoursSince = iso => iso ? (Date.now() - new Date(iso)) / 36e5 : 0;
const waitLabel = h => h < 48 ? `${Math.max(1, Math.round(h))}h` : `${Math.round(h / 24)}d`;
const inDays = iso => { const d = Math.max(1, Math.ceil((new Date(iso) - Date.now()) / 86400000)); return d === 1 ? "tomorrow" : `in ${d}d`; };
const days = x => x == null ? "–" : x < 1 ? `${Math.round(x * 24)}h` : `${x.toFixed(x < 10 ? 1 : 0)}d`;
const hours = h => h == null ? "–" : h < 48 ? `${Math.round(h)}h` : `${(h / 24).toFixed(1)}d`;
const pct = x => x == null ? "–" : `${Math.round(x * 100)}%`;
const plain = s => String(s ?? "").replace(/```[\s\S]*?```/g, " ").replace(/`([^`]*)`/g, "$1").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
  .replace(/\*\*|__/g, "").replace(/^\s*[#>*-]+\s+/gm, "").replace(/\s+/g, " ").trim();
function firstSentence(text, max = 240) {
  const t = plain(text);
  if (!t) return "";
  const re = /[.!?](?=\s|$)/g;
  let end = t.length, m;
  while ((m = re.exec(t))) {
    if (/\b(e\.g|i\.e|vs)\.$/i.test(t.slice(0, m.index + 1))) continue;
    end = m.index + 1;
    break;
  }
  const s = t.slice(0, end);
  return s.length > max ? `${s.slice(0, max - 1).trimEnd()}…` : s;
}

function diffHtml(patch) {
  if (!patch) return "";
  const lines = patch.replace(/\n$/, "").split("\n").map(l => {
    let c = "";
    if (l.startsWith("+++") || l.startsWith("---") || l.startsWith("diff ") || l.startsWith("index ")) c = "meta";
    else if (l.startsWith("@@")) c = "hunk";
    else if (l.startsWith("+")) c = "add";
    else if (l.startsWith("-")) c = "del";
    return `<span class="${c}">${esc(l) || " "}</span>`;
  }).join("");
  return `<div class="diff" tabindex="0" role="region" aria-label="Diff"><pre>${lines}</pre></div>`;
}

function copyBlock(text) {
  return `<div class="copyable">${esc(text)}<button class="copy" type="button" data-copy="${esc(text)}">Copy</button></div>`;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch { return false; }
}

const ACTIONS_ON = location.protocol === "https:";
const POLL_MS = 5000;
const KIND = { pr: "PR", repro: "Repro", triage: "Triage", review: "Review" };
const FLIGHT = {
  in_review: ["In review", ""], waiting_on_you: ["Waiting on you", "wait"], approved_by_reviewer: ["Approved by a reviewer", "good"],
  claimed: ["Claimed", ""], submitting: ["Sending now", "accent"], approved: ["Approved, not sent", "wait"], pr_open: ["PR open", ""],
};

/* ---------- the 30-second read ---------- */

function read30(it) {
  const b = it.briefing || {}, pr = it.pr || {}, tests = b.tests || {};
  const fix = (it.pr && pr.title) || firstSentence(b.change_explained);
  let proof;
  if (b.mode === "guide") proof = "You write the fix and its tests.";
  else proof = tests.ran ? `Tests ran${tests.result ? `: ${esc(firstSentence(tests.result, 110))}` : ""}` : `Tests <span class="bad">not run</span>`;
  const conf = firstSentence(b.confidence, 150).replace(/[.]$/, "");
  const line = (lab, html) => html ? `<div class="l"><span class="lab">${lab}</span><span class="v">${html}</span></div>` : "";
  return `<section class="sec" aria-label="30-second read"><h4>30-second read</h4><div class="read30">
    ${line("Broken", esc(firstSentence(b.summary)))}
    ${line("Fix", esc(fix))}
    ${line("Confidence", `${conf ? `${esc(conf)} · ` : ""}${proof}`)}
    ${line("Main risk", esc(firstSentence(b.risks)))}
  </div></section>`;
}

const fold = (title, inner) => inner ? `<details class="fold"><summary>${title}</summary><div class="inner">${inner}</div></details>` : "";
function folds(b, withWhy) {
  const qa = (b.maintainer_qa || []).map(x => `<div><b>${esc(x.q)}</b><div class="md">${md(x.a)}</div></div>`).join("");
  const alts = (b.alternatives || []).map(a => `<li>${code(a)}</li>`).join("");
  const out = [
    withWhy ? fold("Why this one", `<div class="md">${md(b.why)}</div>`) : "",
    withWhy ? fold(b.mode === "guide" ? "What the fix needs to do" : "The change, explained", `<div class="md">${md(b.change_explained)}</div>`) : "",
    fold("Be ready for review", qa ? `<div class="qa">${qa}</div>` : ""),
    fold("How the code works", `<div class="md">${md(b.walkthrough)}</div>`),
    fold("Alternatives considered", alts ? `<ul>${alts}</ul>` : ""),
  ].join("");
  return out ? `<div class="folds">${out}</div>` : "";
}

function modelsLine(b) {
  const m = (b.models_used || []).filter(x => x && x.model);
  if (!m.length) return "";
  const name = s => { s = String(s); return s.charAt(0).toUpperCase() + s.slice(1); };
  const parts = m.map((x, i) => i === 0 ? `Prepared by ${name(x.model)}` : `${x.did ? String(x.did).toLowerCase() : "helped"} by ${name(x.model)}`);
  return `<p class="foot-note">${esc(parts.join(" · "))}</p>`;
}

/* ---------- the action bar ---------- */

function bar(defs) {
  if (!ACTIONS_ON) return `<div class="bar"><p class="note">The buttons appear when this page is opened at your dashboard address.</p></div>`;
  return `<div class="bar"><div class="result" role="status" aria-live="polite"></div><div class="bar-btns">${
    defs.map(([act, label, cls]) => `<button class="btn ${cls || ""}" type="button" data-act="${act}">${label}</button>`).join("")}</div></div>`;
}

/* ---------- detail views ---------- */

function problemsHtml(it) {
  return `${(it.problems || []).length ? `<div class="err">This item no longer validates and will be refused: ${esc(it.problems.join("; "))}</div>` : ""}
    ${it.last_error ? `<div class="err">Last attempt failed: ${esc(it.last_error)}</div>` : ""}`;
}

function detailReady(it) {
  const b = it.briefing || {}, pr = it.pr || {};
  const isPr = (it.kind || "pr") === "pr";
  const target = b.post_target || it.post_target || "";
  const fields = isPr ? `
    <section class="sec"><h4>The change</h4>${it.patch ? diffHtml(it.patch) : `<p class="note">No diff on file.</p>`}</section>
    <section class="sec"><h4>Pull request text</h4>
      <label class="field">Title<input name="title" maxlength="256" value="${esc(pr.title)}"></label>
      ${pr.disclosure ? `<p class="disclosure"><b>Keep this sentence in the description.</b> The project asks for it: <mark>${esc(pr.disclosure)}</mark></p>` : ""}
      <label class="field">Description<textarea name="body">\n${esc(pr.body)}</textarea></label>
      <p class="note">Opens from <span class="mono">${esc(DATA.login)}:${esc(pr.branch)}</span> into <span class="mono">${esc(pr.base)}</span> on ${esc(it.repo)}${pr.signoff ? ", with a Signed-off-by line" : ""}.</p>
    </section>`
    : `<section class="sec"><h4>${esc({ repro: "Repro comment", triage: "Triage comment", review: "Review comment" }[it.kind] || "Comment")}</h4>
      <p class="note">Goes on ${link(target, `${esc(target.replace("https://github.com/", ""))} ↗`)}</p>
      <label class="field">Comment<textarea name="body">\n${esc(it.post)}</textarea></label></section>`;
  const verb = isPr ? "Submit PR" : "Post comment";
  return `<div class="detail" data-key="${esc(it.key)}" data-slug="${esc(it.slug)}" data-repo="${esc(it.repo)}" data-target="${esc(target)}">
    ${read30(it)}
    ${problemsHtml(it)}
    ${fields}
    ${folds(b, false)}
    ${modelsLine(b)}
    ${it.pairing ? `<p class="note">In your pairing queue. <button class="linkbtn" type="button" data-act="unpair">Unpair</button></p>` : ""}
    ${bar([[isPr ? "submit" : "post", verb, "primary"], ["later", "Later"], ["skip", "Skip", "danger"]])}
  </div>`;
}

function prepareBlock(it) {
  const b = it.briefing || {};
  if (it.status !== "suggested" || it.pairing) return { blocked: "", defs: [] };  // pairing means you do it yourself
  if (it.prepare_requested_at) return { blocked: `<p class="reason"><b>Requested for tonight.</b> The next nightly run will try to prepare it.</p>`, defs: [] };
  if (b.mode === "guide") return { blocked: `<p class="reason">Prepare isn't offered: this project doesn't accept AI-written code, so you write the fix. Pair on your laptop instead.</p>`, defs: [] };
  if (b.ai_posts_forbidden) return { blocked: `<p class="reason">Prepare isn't offered: this project forbids AI-written posts. Pair on your laptop instead.</p>`, defs: [] };
  return { blocked: "", defs: [["prepare", "Prepare this", "primary wide"]] };
}

function detailBriefing(it) {
  const b = it.briefing || {};
  const { blocked, defs } = prepareBlock(it);
  const canPark = ["suggested", "ready", "approved"].includes(it.status);
  const pairBtn = it.pairing ? [["unpair", "Unpair", "wide"]] : [["pair", "Pair on laptop", defs.length ? "wide" : "primary"]];
  return `<div class="detail" data-key="${esc(it.key)}" data-slug="${esc(it.slug)}" data-repo="${esc(it.repo)}">
    ${read30(it)}
    ${blocked}
    ${it.pairing ? `<section class="sec"><h4>On your laptop</h4><p class="note">Start a Claude Code session in the oss-scout repo and paste:</p>${copyBlock(`/contribute ${it.key}`)}</section>` : ""}
    ${folds(b, true)}
    ${modelsLine(b)}
    <p class="note">${link(it.url || b.url, "Open the issue ↗")}</p>
    ${bar([...defs, ...pairBtn, ...(canPark ? [["later", "Later"], ["skip", "Skip", "danger"]] : [])])}
  </div>`;
}

function commentsHtml(list) {
  return (list || []).map(c => `<div class="cmt"><div class="who"><b>${esc(c.author)}</b> · ${esc(c.kind)}${c.path ? ` · ${esc(c.path)}${c.line ? `:${esc(c.line)}` : ""}` : ""} · ${esc(ago(c.at))}${c.url ? ` · ${link(c.url, "open ↗")}` : ""}</div><div class="md">${md(c.body)}</div></div>`).join("");
}

function detailWaiting(w) {
  const f = w.followup, h = hoursSince(w.since);
  const head = `<div class="facts"><div>${link(w.pr_url, "Open the PR ↗")} · waiting ${esc(waitLabel(h))}${w.overdue || h > 48 ? ` <span class="bad">· overdue</span>` : ""}</div></div>
    <section class="sec"><h4>What they said</h4>${commentsHtml(w.comments) || `<p class="note">The comments are on GitHub.</p>`}</section>`;
  const attrs = `data-key="${esc(w.key)}" data-slug="${esc(w.slug)}" data-repo="${esc(w.repo || "")}"`;
  if (f && f.kind === "small" && !f.done) {
    const addressed = (f.comments_addressed || []).map(c => `<li>${code(c)}</li>`).join("");
    const bad = (f.problems || []).length;
    return `<div class="detail" ${attrs}>${head}
      ${addressed ? `<section class="sec"><h4>What this fixes</h4><div class="facts"><ul>${addressed}</ul></div></section>` : ""}
      ${bad ? `<div class="err">Needs attention before it can be sent: ${esc(f.problems.join("; "))}</div>` : ""}
      ${f.patch ? `<section class="sec"><h4>The fix</h4>${diffHtml(f.patch)}</section>` : ""}
      <section class="sec"><h4>Your reply</h4><label class="field">Reply<textarea class="short" name="body">\n${esc(f.reply)}</textarea></label></section>
      ${bar([["followup", f.patch ? "Push fix &amp; reply" : "Post reply", "primary"]])}
    </div>`;
  }
  if (f && f.kind === "discuss") {
    return `<div class="detail" ${attrs}>${head}
      <section class="sec"><h4>Talking points</h4><div class="facts"><ul>${(f.talking_points || []).map(t => `<li>${code(t)}</li>`).join("")}</ul></div></section>
      <section class="sec"><h4>Take this to your laptop</h4><p class="note">Start it with <code>/contribute</code> and the PR link:</p>${copyBlock(`/contribute ${w.pr_url}`)}</section>
    </div>`;
  }
  return `<div class="detail" ${attrs}>${head}
    <p class="reason">${f && f.done ? "Your reply went out. The next scan will confirm." : "A draft is on its way (usually within the hour)."} ${link(w.pr_url, "Open the PR to reply yourself ↗")}</p>
  </div>`;
}

function detailFlight(r) {
  const [label] = FLIGHT[r.status] || [r.status];
  return `<div class="detail" data-slug="${esc(r.slug)}">
    <div class="facts">
      <div><b>${esc(label)}</b>${r.created_at ? ` · opened ${esc(ago(r.created_at))}` : ""}${r.updated_at ? ` · updated ${esc(ago(r.updated_at))}` : ""}</div>
      ${r.last_error ? `<div class="err">Last attempt failed: ${esc(r.last_error)}</div>` : ""}
    </div>
    ${(r.comments || []).length ? `<section class="sec"><h4>Latest from reviewers</h4>${commentsHtml(r.comments)}</section>` : ""}
    <div class="bar-btns"><a class="btn primary" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener">Open on GitHub ↗</a></div>
  </div>`;
}

/* ---------- rows ---------- */

const ITEMS = {};
let OPEN = null;

function rowParts(it, group) {
  const b = it.briefing || {};
  if (group === "waiting") {
    const h = hoursSince(it.since), late = it.overdue || h > 48;
    return { ref: `${it.repo}#${it.pr_number}`, title: it.title, late,
      chips: `<span class="chip ${late ? "late" : "wait"}">${late ? "Overdue" : "Waiting"} ${esc(waitLabel(h))}</span>`, age: "" };
  }
  if (group === "flight") {
    const [label, cls] = FLIGHT[it.status] || [it.status, ""];
    return { ref: `${it.repo}#${it.number}`, title: it.title, late: false, chips: `<span class="chip ${cls}">${esc(label)}</span>`, age: short(it.updated_at || it.created_at) };
  }
  const title = b.title || it.title;
  let chips = "";
  if (group === "ready" || (group === "snoozed" && ["ready", "approved"].includes(it.status))) {
    chips = `<span class="chip accent">${esc(KIND[it.kind || "pr"] || "Comment")}</span>${it.status === "approved" ? `<span class="chip wait">Approved</span>` : ""}`;
    if (it.pairing) chips += `<span class="chip">Pairing</span>`;
  } else {
    chips = `${b.mode === "guide" ? `<span class="chip guide">You write it</span>` : b.difficulty ? `<span class="chip accent">${esc(b.difficulty)}</span>` : ""}${it.pairing ? `<span class="chip">Pairing</span>` : ""}${it.prepare_requested_at ? `<span class="chip accent">Requested</span>` : ""}`;
  }
  if (group === "snoozed") chips += `<span class="chip">Back ${esc(inDays(it.snoozed_until))}</span>`;
  return { ref: it.key, title, late: false, chips, age: short(it.suggested_at) };
}

function rowHtml(it, group) {
  const p = rowParts(it, group);
  const owned = group !== "flight" || !it.in_inbox;  // an in-flight row for something in the inbox just points at it
  return `<article class="item${p.late ? " late" : ""}" ${owned ? `id="${esc(it.slug)}"` : `data-goto="${esc(it.slug)}"`} data-slug="${esc(it.slug)}">
    <button class="head" type="button" aria-expanded="false">
      <span class="top-line">${p.chips}<span class="ref">${esc(p.ref)}</span><span class="sp"></span><span class="age">${esc(p.age)}</span></span>
      <span class="title-line"><span class="t">${esc(p.title)}</span><span class="chev" aria-hidden="true">▾</span></span>
    </button>
  </article>`;
}

function detailHtml(slug) {
  const { item: it, group } = ITEMS[slug];
  if (group === "waiting") return detailWaiting(it);
  if (group === "flight") return detailFlight(it);
  const prepared = ["ready", "approved"].includes(it.status);
  return (group === "ready" || (group === "snoozed" && prepared)) ? detailReady(it) : detailBriefing(it);
}

function collapse() {
  if (!OPEN) return;
  const art = document.getElementById(OPEN);
  if (art) {
    art.classList.remove("open");
    $(".head", art).setAttribute("aria-expanded", "false");
    const d = $(":scope > .detail", art);
    if (d) d.hidden = true;
  }
  OPEN = null;
}

function expand(slug, { scroll = true } = {}) {
  const art = document.getElementById(slug);
  if (!art || !ITEMS[slug]) return;
  collapse();
  let d = $(":scope > .detail", art);
  if (!d) { art.insertAdjacentHTML("beforeend", detailHtml(slug)); d = $(":scope > .detail", art); }
  d.hidden = false;
  art.classList.add("open");
  $(".head", art).setAttribute("aria-expanded", "true");
  OPEN = slug;
  try { history.replaceState(null, "", `#${slug}`); } catch {}
  if (scroll) art.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

document.addEventListener("click", e => {
  const head = e.target.closest(".item > .head");
  if (!head) return;
  const art = head.parentElement;
  if (art.dataset.goto) { openSlug(art.dataset.goto); return; }
  if (OPEN === art.id) { collapse(); try { history.replaceState(null, "", location.pathname + location.search); } catch {} }
  else expand(art.id);
});

/* ---------- tabs ---------- */

function group(g, hot) {
  if (!g.items.length) return "";
  if (g.id === "snoozed") return `<details class="snoozed"><summary class="group-title">Snoozed <span class="n">${g.items.length}</span></summary><div class="rows">${g.items.map(i => rowHtml(i, "snoozed")).join("")}</div></details>`;
  const hint = { waiting: "A maintainer is waiting. Red means more than 48 hours.", pairing: "Marked for a /contribute session on your laptop." }[g.id];
  return `<section class="group" aria-label="${esc(g.label)}"><div class="group-title${hot ? " hot" : ""}">${esc(g.label)} <span class="n">${g.items.length}</span></div>${hint ? `<p class="group-hint">${hint}</p>` : ""}${g.items.map(i => rowHtml(i, g.id)).join("")}</section>`;
}

function renderInbox() {
  const html = DATA.inbox.map(g => group(g, g.id === "waiting")).join("");
  const note = DATA.note ? `<p class="note">Last night: ${esc(DATA.note)}</p>` : "";
  if (!DATA.to_do && !DATA.inbox.some(g => g.items.length)) return `<div class="empty"><h3>All clear</h3><p class="muted">Nothing needs you today. A quiet morning is a normal one.</p></div>${note}`;
  return html + note;
}

function renderFlight() {
  const rows = DATA.in_flight;
  if (!rows.length) return `<div class="empty"><h3>Nothing in flight</h3><p class="muted">Open pull requests and anything you've claimed show up here.</p></div>`;
  return `<section class="group">${rows.map(r => rowHtml(r, "flight")).join("")}</section>`;
}

function prRow(p, featured, full) {
  const key = `${p.repo}#${p.number}`, merged = p.status === "merged";
  const max = DATA.limits.summary;
  const star = merged ? `<button class="icon-btn" type="button" data-act="${featured ? "unfeature" : "feature"}" aria-pressed="${featured}" aria-label="${featured ? "Remove from featured" : "Feature this PR"}" ${!featured && full ? `disabled title="${DATA.limits.featured}/${DATA.limits.featured} featured. Unstar one first."` : ""}>${featured ? "★" : "☆"}</button>` : "";
  const edit = `<button class="icon-btn" type="button" data-edit aria-label="Edit the impact line" aria-expanded="false">✎</button>`;
  return `<article class="pf${featured ? " feat" : ""}" data-key="${esc(key)}">
    <div class="main">
      <div class="ref">${esc(key)} · ${merged ? `<span class="chip merged">Merged</span>` : `<span class="chip good">In review</span>`}</div>
      <div class="head-t">${link(p.url, esc(p.summary || p.title))}</div>
      ${p.summary ? `<div class="sub">${esc(p.title)}</div>` : `<div class="no-line">No impact line yet. The public page shows the title.</div>`}
    </div>
    <div class="tools">${star}${edit}</div>
    <div class="full" data-form hidden>
      <label class="field">Impact line, shown on the public page (one line, max ${max})<input name="body" type="text" maxlength="${max}" value="${esc(p.summary || "")}" autocomplete="off"></label>
      <div class="edit-row"><button class="btn primary" type="button" data-act="summary">Save</button><button class="btn" type="button" data-edit-cancel>Cancel</button></div>
      <p class="note">Leave it empty to remove it.</p>
    </div>
    <div class="full"><div class="result" role="status" aria-live="polite"></div></div>
  </article>`;
}

function renderPortfolio() {
  const P = DATA.portfolio, lim = DATA.limits.featured;
  const featured = P.featured || [], listed = P.prs || [];
  const full = featured.length >= lim;
  const order = { open: 0, merged: 1 };
  const rows = [...listed].sort((a, b) => order[a.status] - order[b.status] || (b.merged_at || b.created_at || "").localeCompare(a.merged_at || a.created_at || ""));
  const mergedProjects = (P.projects || []).filter(p => p.merged).length;
  let html = `<div class="pf-note"><span>This is the public page, as the world sees it. <b>It updates nightly</b>, so a change here shows up there tomorrow.</span><a href="${esc(P.url)}" target="_blank" rel="noopener">${esc(P.url.replace(/^https:\/\//, "").replace(/\/$/, ""))} ↗</a></div>
    <div class="pf-stats"><div class="stat"><b>${esc(P.merged_prs)}</b><span>merged</span></div><div class="stat"><b>${mergedProjects}</b><span>${mergedProjects === 1 ? "project" : "projects"}</span></div><div class="stat"><b>${esc(P.open_prs)}</b><span>in review</span></div></div>`;
  html += `<div class="group"><div class="group-title">Featured <span class="n">${featured.length}/${lim}</span></div><p class="group-hint">${full ? `${lim}/${lim} featured. Unstar one to feature another.` : `Star up to ${lim} merged PRs to show them first.`}</p>
    ${featured.map(p => prRow(p, true, full)).join("") || `<div class="empty"><p class="muted">Nothing featured yet.</p></div>`}</div>`;
  html += `<div class="group"><div class="group-title">${featured.length ? "More pull requests" : "Pull requests"} <span class="n">${rows.length}</span></div>
    ${rows.map(p => prRow(p, false, full)).join("") || `<div class="empty"><p class="muted">No other pull requests yet.</p></div>`}</div>`;
  const projects = P.projects || [];
  if (projects.length) html += `<div class="group"><div class="group-title">Projects <span class="n">${projects.length}</span></div><div class="cards">${projects.map(p => `<div class="card">
      <a class="repo" href="https://github.com/${esc(p.repo)}" target="_blank" rel="noopener">${esc(p.repo)}</a>
      <div class="meta"><span><b>${esc(p.merged)}</b> merged</span>${p.open ? `<span>${esc(p.open)} in review</span>` : ""}${p.ladder ? `<span>${esc(p.ladder)}</span>` : ""}${p.language ? `<span>${esc(p.language)}</span>` : ""}${p.stars != null ? `<span>★ ${esc(p.stars >= 1000 ? `${(p.stars / 1000).toFixed(p.stars >= 10000 ? 0 : 1)}k` : p.stars)}</span>` : ""}</div></div>`).join("")}</div></div>`;
  const rv = (P.reviews || []).length, is = (P.issues || []).length;
  if (rv || is) html += `<p class="note">Also shown: ${rv} ${rv === 1 ? "review" : "reviews"} given, ${is} ${is === 1 ? "issue" : "issues"} filed.</p>`;
  return html;
}

function renderProjects() {
  const h = DATA.projects.home, repos = DATA.projects.repos;
  let html = `<div class="home"><h3>${h.chosen.length ? "Your home projects" : h.provisional ? "Home projects: still exploring" : "Suggested home projects"}</h3>`;
  if (h.chosen.length) html += `<ol>${h.chosen.map(r => `<li class="mono">${esc(r)}</li>`).join("")}</ol>`;
  else if (h.top.length) html += `<p>${h.provisional ? `Going wide until <b>${esc(h.until)}</b>. Leading so far:` : "Based on what got merged and how each project treats outside contributors:"}</p><ol>${h.top.map(r => `<li><span class="mono">${esc(r.repo)}</span> <span class="muted">(${esc(r.merged)} merged, ${esc(r.open)} open)</span></li>`).join("")}</ol>`;
  else html += `<p>Going wide until <b>${esc(h.until)}</b>. Once you have a few PRs in, the projects that respond best to you will show up here.</p>`;
  html += `</div><div class="group"><div class="group-title">How each project treats outside contributors <span class="n">${repos.length}</span></div><div class="cards">${repos.map(r => `<div class="card">
    <a class="repo" href="https://github.com/${esc(r.repo)}" target="_blank" rel="noopener">${esc(r.repo)}</a>
    <div class="meta"><span>${esc(r.tier)}</span>${r.language ? `<span>${esc(r.language)}</span>` : ""}</div>
    <div><span class="bar-meter"><i style="width:${Math.round(r.friendliness * 100)}%"></i></span><b class="mono">${Math.round(r.friendliness * 100)}</b> friendliness${r.confident ? "" : ` <span class="muted" title="Fewer than 5 outside PRs to measure">(few PRs measured)</span>`}</div>
    <dl class="kv">
      <div><dt>PRs merged</dt><dd>${r.merges_elsewhere ? `<span class="muted">elsewhere</span>` : pct(r.merge_rate)}</dd></div>
      <div><dt>Time to merge</dt><dd>${r.merges_elsewhere ? "–" : days(r.median_days_to_merge)}</dd></div>
      <div><dt>First reply</dt><dd>${hours(r.median_hours_to_first_response)}</dd></div>
      <div><dt>AI policy</dt><dd class="policy-${esc(r.ai_policy)}" title="${esc(r.ai_policy_evidence)}">${esc({ restrictive: "Restrictive", disclosure: "Disclose", mentioned: "Mentioned", none: "–" }[r.ai_policy] || r.ai_policy)}</dd></div>
      <div><dt>CLA</dt><dd>${r.cla ? "Yes" : "–"}</dd></div>
    </dl></div>`).join("")}</div></div>
    <p class="note">Measured from each project's last 300 closed pull requests by occasional outside contributors (PRs from forks, by people with fewer than 3 recent PRs). "First reply" is the median time until a maintainer or regular responded.</p>`;
  return html;
}

function renderLog() {
  const acts = DATA.log.actions, runs = DATA.log.runs;
  let html = `<div class="group"><div class="group-title">Live runs</div><div class="list" id="live"><div class="logrow"><span class="what muted">${ACTIONS_ON ? "Loading…" : "Shown when this page is opened at your dashboard address."}</span></div></div></div>`;
  html += `<div class="group"><div class="group-title">Your taps <span class="n">${acts.length}</span></div>${acts.length ? `<div class="list">${acts.map(x => `<div class="logrow"><span class="k">${esc(x.key)} · ${esc(x.action)}</span><span class="when">${esc(ago(x.at))}</span><span class="what"><span class="${x.result === "ok" ? "res-ok" : "res-bad"}">${esc(x.result === "ok" ? "done" : x.result)}</span>${x.note ? ` (${esc(x.note)})` : ""}${x.url ? ` ${link(x.url, "open ↗")}` : ""}</span></div>`).join("")}</div>` : `<div class="empty"><p class="muted">Nothing tapped yet.</p></div>`}</div>`;
  html += `<div class="group"><div class="group-title">Nightly scans <span class="n">${runs.length}</span></div>${runs.length ? `<div class="list">${runs.map(r => `<div class="logrow"><span class="k">${esc(r.seconds != null ? `${r.seconds}s` : "")}${r.api_calls != null ? ` · ${esc(r.api_calls)} API calls` : ""}</span><span class="when">${esc(ago(r.at))}</span><span class="what">${esc(r.raw ?? "?")} issues found, ${esc(r.eligible ?? "?")} eligible, ${esc(r.candidates ?? "?")} sent to the routine</span></div>`).join("")}</div>` : `<div class="empty"><p class="muted">No scans recorded yet.</p></div>`}</div>`;
  return html;
}

async function loadLive() {
  const el = $("#live");
  if (!el || !ACTIONS_ON) return;
  try {
    const res = await fetch("/api/runs");
    const runs = (await res.json()).runs || [];
    const label = r => r.status !== "completed" ? [r.status === "queued" ? "Queued" : "Running", "wait"] : r.conclusion === "success" ? ["Done", "good"] : [r.conclusion || "Failed", "late"];
    el.innerHTML = runs.length ? runs.map(r => { const [t, c] = label(r); return `<div class="logrow"><span class="k">${esc(r.display_title || "run")}</span><span class="when">${esc(ago(r.created_at))}</span><span class="what"><span class="chip ${c}">${esc(t)}</span>${r.html_url && r.html_url.startsWith("https://github.com/") ? ` ${link(r.html_url, "view run ↗")}` : ""}</span></div>`; }).join("")
      : `<div class="logrow"><span class="what muted">No recent runs.</span></div>`;
  } catch { el.innerHTML = `<div class="logrow"><span class="what muted">Couldn't load the run list.</span></div>`; }
}

const TABS = [
  { id: "inbox", label: "Inbox", n: () => DATA.to_do, hot: true, render: renderInbox },
  { id: "flight", label: "In flight", n: () => DATA.in_flight.length, render: renderFlight },
  { id: "portfolio", label: "Portfolio", render: renderPortfolio },
  { id: "projects", label: "Projects", render: renderProjects },
  { id: "log", label: "Log", render: renderLog },
];
let TAB = null;

function show(id) {
  const tab = TABS.find(t => t.id === id) || TABS[0];
  OPEN = null;
  TAB = tab.id;
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.id === tab.id));
  $("#main").innerHTML = `<section class="panel" role="tabpanel">${tab.render()}</section>`;
  try { localStorage.setItem("scout-tab", tab.id); } catch {}
  if (tab.id === "log") loadLive();
}

/* open a row by its slug, from a link or the address bar */
function openSlug(slug) {
  const hit = ITEMS[slug];
  if (!hit) return false;
  if (TAB !== hit.tab) show(hit.tab);
  const art = document.getElementById(slug);
  const sn = art && art.closest("details.snoozed");
  if (sn) sn.open = true;
  expand(slug);
  return true;
}

function fromHash() {
  let h = "";
  try { h = decodeURIComponent(location.hash.slice(1)); } catch {}
  if (!h) return false;
  if (TABS.some(t => t.id === h)) { show(h); return true; }
  return openSlug(h);
}

/* ---------- taps ---------- */

function showResult(box, cls, html) {
  const r = box.querySelector(".result");
  if (r) { r.className = `result ${cls}`; r.innerHTML = html; }
}

async function watchRun(box, key, action, sentAt, prefix) {
  const since = new Date(sentAt).getTime() - 15000, end = Date.now() + 180000;
  const link2 = run => run.html_url && run.html_url.startsWith("https://github.com/") ? ` <a href="${esc(run.html_url)}" target="_blank" rel="noopener">view run ↗</a>` : "";
  const title = `act: ${action} ${key}`;
  while (Date.now() < end) {
    await new Promise(r => setTimeout(r, POLL_MS));
    let runs = [];
    try { runs = (await (await fetch("/api/runs")).json()).runs || []; } catch { continue; }
    const run = runs.find(x => new Date(x.created_at).getTime() >= since && (x.display_title || "") === title);
    if (!run) { showResult(box, "", `${prefix}Waiting for GitHub to start it…`); continue; }
    if (run.status !== "completed") { showResult(box, "", `${prefix}Running…${link2(run)}`); continue; }
    if (run.conclusion === "success") showResult(box, "ok", `${prefix}Done.${link2(run)} <button class="btn" type="button" data-reload>Reload</button>`);
    else showResult(box, "bad", `It did not go through (${esc(run.conclusion)}). Nothing was posted unless the run says so.${link2(run)}`);
    return;
  }
  showResult(box, "", `${prefix}Still running. Check back in a minute and reload.`);
}

const CONFIRM = {
  submit: c => `Open a PR on ${c.dataset.repo} as ${DATA.login}?`,
  post: c => `Post this comment on ${c.dataset.target.replace("https://github.com/", "")} as ${DATA.login}?`,
  followup: c => `Push the fix and post your reply on ${c.dataset.repo} as ${DATA.login}?`,
  skip: () => "Turn this one down? It won't be suggested again.",
};

document.addEventListener("click", async e => {
  const reload = e.target.closest("[data-reload]");
  if (reload) { location.reload(); return; }
  const cp = e.target.closest("button.copy");
  if (cp) {
    const ok = await copyText(cp.dataset.copy), o = cp.textContent;
    cp.textContent = ok ? "Copied" : "Press and hold to copy";
    setTimeout(() => cp.textContent = o, 1600);
    return;
  }
  const edit = e.target.closest("[data-edit], [data-edit-cancel]");
  if (edit) {
    const row = edit.closest(".pf"), form = $("[data-form]", row), open = form.hidden;
    form.hidden = edit.hasAttribute("data-edit-cancel") ? true : !open;
    $("[data-edit]", row).setAttribute("aria-expanded", String(!form.hidden));
    if (!form.hidden) $("input", form).focus();
    return;
  }
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const box = btn.closest("[data-key]"), action = btn.dataset.act, key = box.dataset.key;
  const title = box.querySelector("[name=title]")?.value;
  let body = box.querySelector("[name=body]")?.value;
  const textual = ["submit", "post", "followup", "summary"].includes(action);
  if (action === "summary") body = (body || "").replace(/\s+/g, " ").trim();
  if (["submit", "post", "followup"].includes(action) && !(body || "").trim()) { showResult(box, "bad", "The text can't be empty."); return; }
  const pr = ITEMS[box.dataset.slug]?.item?.pr;
  if (action === "submit" && pr?.disclosure && !(body || "").includes(pr.disclosure)) { showResult(box, "bad", "The description must keep the highlighted disclosure sentence."); return; }
  if (CONFIRM[action] && !confirm(CONFIRM[action](box))) return;
  let prefix = "";
  if (action === "pair") {  // copy first, while the tap still counts as a user gesture
    const ok = await copyText(`/contribute ${key}`);
    prefix = ok ? "Copied. Paste it in Claude Code on your laptop. " : "Couldn't copy: type /contribute and the key yourself. ";
  }
  const all = box.querySelectorAll("button[data-act]");
  all.forEach(b => b.disabled = true);
  showResult(box, "", `${prefix}Started…`);
  const payload = { key, action, ...(action === "submit" && title != null ? { title } : {}), ...(textual && body != null ? { body } : {}) };
  try {
    const res = await fetch("/api/act", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
    const out = await res.json().catch(() => ({}));
    if (!res.ok || !out.ok) { showResult(box, "bad", esc(out.error || `Failed (${res.status})`)); all.forEach(b => b.disabled = false); return; }
    showResult(box, "", `${prefix}Started. Waiting for GitHub…`);
    watchRun(box, key, action, out.dispatched_at, prefix);
  } catch {
    showResult(box, "bad", "Couldn't reach the dashboard. Try again.");
    all.forEach(b => b.disabled = false);
  }
});

/* ---------- boot ---------- */

function boot() {
  if (!DATA) { $("#main").innerHTML = `<div class="empty"><h3>No data yet</h3><p class="muted">Run <code>python -m scout render</code> after a scan.</p></div>`; return; }
  const todo = $("#todo");
  todo.textContent = `${DATA.to_do} to do`;
  todo.classList.toggle("zero", !DATA.to_do);
  $("#sub").textContent = `@${DATA.login} · updated ${ago(DATA.generated_at)}`;
  const dg = DATA.digest || {};
  if (dg.token_warning) $("#banner").innerHTML = `<div class="banner"><b>Your GitHub token is ${esc(dg.token_age_days)} days old.</b> Create a new classic token with the public_repo scope, save it as SUBMIT_TOKEN in oss-scout-data, and update <code>[submit] token_rotated</code> in targets.toml before it expires at 90 days.</div>`;

  for (const g of DATA.inbox) for (const it of g.items) ITEMS[it.slug] = { tab: "inbox", item: it, group: g.id };
  for (const r of DATA.in_flight) if (!r.in_inbox && !ITEMS[r.slug]) ITEMS[r.slug] = { tab: "flight", item: r, group: "flight" };

  $("#tabs").innerHTML = TABS.map(t => `<button role="tab" type="button" data-id="${t.id}">${t.label}${t.n ? `<span class="n${t.hot && t.n() ? " hot" : ""}">${t.n()}</span>` : ""}</button>`).join("");
  $("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { show(b.dataset.id); try { history.replaceState(null, "", location.pathname + location.search); } catch {} } });
  addEventListener("hashchange", fromHash);
  if (fromHash()) return;
  let start = "inbox";
  try { start = localStorage.getItem("scout-tab") || "inbox"; } catch {}
  show(start);
}
boot();
</script>
