name: nightly

# Scans GitHub, saves the results to the private data repo, and publishes the
# public portfolio page. The AI step runs afterwards as a Claude routine that
# reads these results from the data repo.

on:
  schedule:
    # GitHub starts scheduled runs hours late, so this is early on purpose. When the
    # scan saves its results, a step below starts the Claude routine.
    - cron: "17 4 * * *"   # 9:17pm Pacific during daylight time (8:17pm in winter)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check out private data
        uses: actions/checkout@v4
        with:
          repository: aadityad12/oss-scout-data
          ref: claude/scout-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reuse the HTTP cache from earlier runs
        uses: actions/cache@v4
        with:
          path: data/.cache
          key: scout-cache-${{ github.run_id }}
          restore-keys: scout-cache-

      - name: Scan
        env:
          GH_TOKEN: ${{ github.token }}
          SCOUT_DATA_DIR: data
        run: python -m scout run

      - name: Save results to the data repo
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "scan: $(date -u +%Y-%m-%d)"
            git pull -q --rebase origin claude/scout-data
            git push -q origin HEAD:claude/scout-data
          fi

      # Routines can't be triggered by a workflow finishing, so this calls the
      # routine's API trigger. Skipped until both secrets are set; the routine's
      # morning schedule still runs either way.
      - name: Start the Claude routine
        env:
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_TOKEN: ${{ secrets.ROUTINE_TOKEN }}
        run: |
          if [ -z "$ROUTINE_FIRE_URL" ] || [ -z "$ROUTINE_TOKEN" ]; then
            echo "Routine trigger not configured"
            exit 0
          fi
          curl -sS --fail-with-body -o /dev/null -X POST "$ROUTINE_FIRE_URL" \
            -H "Authorization: Bearer $ROUTINE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Build public page
        env:
          SCOUT_DATA_DIR: data
        run: python -m scout render-public --out site --domain oss.aadityad.dev

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
